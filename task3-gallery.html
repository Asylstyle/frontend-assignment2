<main>
    <h1>Task 3: Photo Gallery</h1>
    <p>Hover over a photo or select it with Tab to see its caption.</p>

    <section class="gallery" aria-label="Nine landscape photographs">
        <figure class="gallery-item" id="photo1" tabindex="0">
            <img src="images/photo1.jpg" alt="Forest and lake landscape">
            <figcaption>Forest and lake</figcaption>
        </figure>
        <figure class="gallery-item" id="photo2" tabindex="0">
            <img src="images/photo2.jpg" alt="Waterfall in a rocky landscape">
            <figcaption>Waterfall</figcaption>
        </figure>
        <figure class="gallery-item" id="photo3" tabindex="0">
            <img src="images/photo3.jpg" alt="Trees in a forest">
            <figcaption>Forest walk</figcaption>
        </figure>
        <figure class="gallery-item" id="photo4" tabindex="0">
            <img src="images/photo4.jpg" alt="Mountain landscape">
            <figcaption>Mountain view</figcaption>
        </figure>
        <figure class="gallery-item" id="photo5" tabindex="0">
            <img src="images/photo5.jpg" alt="Landscape under an open sky">
            <figcaption>Open sky</figcaption>
        </figure>
        <figure class="gallery-item" id="photo6" tabindex="0">
            <img src="images/photo6.jpg" alt="Outdoor landscape photograph">
            <figcaption>Exploring outdoors</figcaption>
        </figure>
        <figure class="gallery-item" id="photo7" tabindex="0">
            <img src="images/photo7.jpg" alt="Natural scenery">
            <figcaption>Quiet scenery</figcaption>
        </figure>
        <figure class="gallery-item" id="photo8" tabindex="0">
            <img src="images/photo8.jpg" alt="Outdoor view from the photo collection">
            <figcaption>A new view</figcaption>
        </figure>
        <figure class="gallery-item" id="photo9" tabindex="0">
            <img src="images/photo9.jpg" alt="Landscape from the travel collection">
            <figcaption>Weekend exploration</figcaption>
        </figure>
    </section>
